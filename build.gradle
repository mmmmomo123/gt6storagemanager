buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "http://files.minecraftforge.net/maven"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/repositories/snapshots/"
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:1.2-SNAPSHOT'
    }
}

apply plugin: 'forge'

version = "1.0.9"
group = "gtsm"
archivesBaseName = "gtsm"

sourceCompatibility = targetCompatibility = 1.7

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = "run"
}

// GT6 作为编译期依赖（provided：不打包进 jar，运行时由 GT6 提供）。
// 编译期所有 Minecraft 调用都应先强转成 IInventory 等 MCP 命名的类型，
// GT 自家方法（insertItems 等未被混淆的方法）可直接调用。
configurations { provided }

dependencies {
    provided files("libs/gregtech_1.7.10-6.17.06.jar")
}

// 把 GT6 追加到 classpath 末尾，确保 ForgeGradle 提供的（MCP 名的）Minecraft 优先。
sourceSets.main.compileClasspath += configurations.provided
sourceSets.main.runtimeClasspath += configurations.provided

processResources {
    // 版本号变化时重新执行该任务
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    // 替换 mcmod.info 中的占位符
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    // 其余资源原样复制
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

// Mojang 早已关闭 http://s3.amazonaws.com/Minecraft.Download（ForgeGradle 1.2 写死了该地址，
// 直接 setupCIWorkspace 会 FileNotFoundException: .../versions/1.7.10/1.7.10.jar）。
// 这里把相关下载任务的 URL 换成 Mojang 官方新地址（sha1 不变，内容一致）。
afterEvaluate {
    def dead = "http://s3.amazonaws.com/Minecraft.Download"
    def replace = { String url ->
        if (url.contains("minecraft_server")) {
            return "https://launcher.mojang.com/v1/objects/952438ac4e01b4d115c5fc38f891710c4941df29/server.jar"
        } else if (url.endsWith("1.7.10.json")) {
            return "https://piston-meta.mojang.com/v1/packages/ed5d8789ed29872ea2ef1c348302b0c55e3f3468/1.7.10.json"
        } else if (url.endsWith("1.7.10.jar")) {
            return "https://launcher.mojang.com/v1/objects/e80d9b3bf5085002218d4be59e668bac718abbc6/client.jar"
        }
        return null
    }
    tasks.withType(net.minecraftforge.gradle.tasks.abstractutil.DownloadTask).all { t ->
        def u = ""
        try { u = t.url == null ? "" : t.url.toString() } catch (Throwable ignored) { u = "" }
        if (u.startsWith(dead)) {
            def nu = replace(u)
            if (nu != null) {
                t.url = new net.minecraftforge.gradle.delayed.DelayedString(project, nu)
                logger.lifecycle("Patched download URL: ${u} -> ${nu}")
            }
        }
    }
}

// 外部 Mod API 桩类（AE2/IC2/BC/CoFH/NEI/Mekanism）仅用于编译期解析 GT6 继承链，
// 不打进产物 jar：运行时由真实 Mod 提供。
jar {
    exclude 'appeng/**'
    exclude 'ic2/**'
    exclude 'buildcraft/**'
    exclude 'cofh/**'
    exclude 'codechicken/**'
    exclude 'mekanism/**'
}
