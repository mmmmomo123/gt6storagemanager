name: Build Mod (JDK 8)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Ensure gradlew has LF endings
        run: sed -i 's/\r$//' gradlew

      - name: Setup CI workspace
        run: chmod +x gradlew && ./gradlew setupCIWorkspace --no-daemon --stacktrace

      - name: Build
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: gtsm-jar
          path: build/libs/*.jar
          if-no-files-found: error
